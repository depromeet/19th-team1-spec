name: 기획 피드백
description: PRD에 대한 질문, 수정 제안, 빠진 것
labels: [feedback]
body:
  - type: input
    id: target
    attributes:
      label: 대상 ID
      description: 요구사항·OQ ID. 여러 개면 쉼표로 (예) R-02, OQ-11
      placeholder: R-02
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 질문
        - 수정 제안
        - 빠진 것
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 내용
      description: 무엇이 왜 문제인지, 어떻게 바꾸면 좋을지
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 근거
      description: 회의, 리서치, 피그마, 데이터 링크
